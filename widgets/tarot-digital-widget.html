const roman=['I','II','III','IV','V','VI','VII'];
const AudioEngine=window.AudioContext||window.webkitAudioContext;let audioContext=null,soundEnabled=true;try{soundEnabled=localStorage.getItem('tarot-digital-sound')!=='off'}catch(error){}
function getAudioContext(){if(!soundEnabled||!AudioEngine)return null;if(!audioContext)audioContext=new AudioEngine();if(audioContext.state==='suspended')audioContext.resume();return audioContext}
function tone(ctx,frequency,start,duration=.28,volume=.035,type='sine'){const oscillator=ctx.createOscillator(),gain=ctx.createGain();oscillator.type=type;oscillator.frequency.setValueAtTime(frequency,start);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(volume,start+.025);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);oscillator.connect(gain).connect(ctx.destination);oscillator.start(start);oscillator.stop(start+duration+.03)}
function whisper(ctx,start,duration=.42,volume=.025){const length=Math.max(1,Math.floor(ctx.sampleRate*duration)),buffer=ctx.createBuffer(1,length,ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/length,1.7);const source=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();source.buffer=buffer;filter.type='bandpass';filter.frequency.value=1250;filter.Q.value=.8;gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(volume,start+.04);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);source.connect(filter).connect(gain).connect(ctx.destination);source.start(start)}
function playSound(name){const ctx=getAudioContext();if(!ctx)return;const now=ctx.currentTime+.015;if(name==='select'){tone(ctx,523.25,now,.32,.032,'triangle');tone(ctx,783.99,now+.055,.38,.024)}else if(name==='deselect'){tone(ctx,392,now,.24,.025,'triangle');tone(ctx,293.66,now+.035,.24,.018)}else if(name==='shuffle'){whisper(ctx,now,.5,.032);[0,.09,.18,.27].forEach((delay,i)=>tone(ctx,180+i*18,now+delay,.075,.018,'triangle'))}else if(name==='reveal'){whisper(ctx,now,.8,.02);[392,523.25,659.25,783.99,1046.5].forEach((frequency,i)=>tone(ctx,frequency,now+i*.105,.65,.026-i*.002,i<2?'sine':'triangle'))}else if(name==='success'){[523.25,659.25,783.99].forEach((frequency,i)=>tone(ctx,frequency,now+i*.11,.52,.026,'triangle'))}else if(name==='close'){tone(ctx,392,now,.28,.018,'sine');tone(ctx,261.63,now+.04,.3,.014)}else if(name==='on'){tone(ctx,440,now,.25,.024,'triangle');tone(ctx,659.25,now+.08,.35,.022)}else if(name==='off'){tone(ctx,392,now,.2,.018,'sine');tone(ctx,246.94,now+.055,.25,.015)}}
const deck=document.querySelector('#deck'),count=document.querySelector('#count'),reveal=document.querySelector('#reveal'),reset=document.querySelector('#reset'),reshuffle=document.querySelector('#reshuffle'),soundToggle=document.querySelector('#sound-toggle'),modal=document.querySelector('#modal'),slots=document.querySelector('#slots');let selection=[],deckCards=[...cards];
function updateSoundToggle(){soundToggle.setAttribute('aria-pressed',String(soundEnabled));soundToggle.title=soundEnabled?'Couper les effets sonores':'Activer les effets sonores';soundToggle.querySelector('.sound-label').textContent=soundEnabled?'Son activé':'Son coupé'}
function render(){deck.innerHTML=deckCards.map((c,i)=>`<button class="tarot ${selection.includes(c.code)?'selected':''}" style="--accent:${c.color}" data-code="${c.code}" aria-pressed="${selection.includes(c.code)}" aria-label="${c.name}, ${c.family}"><span class="card-shell"><img class="card-art" src="${c.art}" alt="" draggable="false"><span class="card-index">${roman[i]}</span><span class="card-family">${c.family}</span><span class="card-title">${c.name}</span></span></button>`).join('');count.textContent=selection.length;reveal.disabled=selection.length!==3;reset.classList.toggle('visible',selection.length>0);slots.innerHTML=[0,1,2].map(i=>`<span class="slot ${selection[i]?'filled':''}">${selection[i]?'✦':i+1}</span>`).join('')}
deck.addEventListener('click',e=>{const b=e.target.closest('[data-code]');if(!b)return;const code=b.dataset.code,wasSelected=selection.includes(code);if(wasSelected){selection=selection.filter(x=>x!==code);playSound('deselect')}else if(selection.length<3){selection=[...selection,code];playSound('select')}render()});reset.onclick=()=>{selection=[];playSound('deselect');render()};
function shuffleDeck(source){const shuffled=[...source];for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}if(shuffled.every((card,i)=>card.code===source[i].code))shuffled.push(shuffled.shift());return shuffled}
reshuffle.onclick=()=>{playSound('shuffle');selection=[];deckCards=shuffleDeck(deckCards);render();deck.classList.remove('dealing');void deck.offsetWidth;deck.classList.add('dealing');window.setTimeout(()=>deck.classList.remove('dealing'),950)};
function trajectory(chosen){const scores={Fondations:0,Identité:0,Croissance:0,Innovation:0};chosen.forEach(c=>{scores.Fondations+=c.wf;scores.Identité+=c.wi;scores.Croissance+=c.wg;scores.Innovation+=c.wn});const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]);const dominant=sorted[0][0], names=chosen.map(c=>c.name).join(', ');const profiles={Fondations:'Le Bâtisseur',Identité:'Le Stratège',Croissance:'L’Accélérateur',Innovation:'L’Alchimiste'};return {name:profiles[dominant],summary:`Votre tirage associe ${names}. Il met en lumière une trajectoire orientée ${dominant.toLowerCase()} : l’enjeu est de relier ces trois leviers dans un même parcours plutôt que de les traiter séparément.`,priority:`Transformer ${chosen.map(c=>c.strength.toLowerCase()).join(', ')} en un système clair, mesurable et cohérent.`,risk:chosen.sort((a,b)=>scores[a.family]-scores[b.family])[0].risk}}
reveal.onclick=()=>{playSound('reveal');const chosen=selection.map(code=>cards.find(c=>c.code===code));const t=trajectory(chosen);document.querySelector('#archetype').textContent=t.name;document.querySelector('#summary').textContent=t.summary;document.querySelector('#priority').textContent=t.priority;document.querySelector('#risk').textContent=t.risk;document.querySelector('#picked').innerHTML=chosen.map(c=>`<span style="--accent:${c.color}">${c.name}</span>`).join('');modal.showModal()};document.querySelector('#close').onclick=()=>{playSound('close');modal.close()};document.querySelector('#contact').onclick=()=>{const email=document.querySelector('#email');if(email.value&&!email.checkValidity()){email.reportValidity();return}playSound('success');document.querySelector('#contact').textContent='Trajectoire enregistrée — merci';document.querySelector('#contact').disabled=true};soundToggle.onclick=()=>{if(soundEnabled){playSound('off');soundEnabled=false}else{soundEnabled=true;playSound('on')}try{localStorage.setItem('tarot-digital-sound',soundEnabled?'on':'off')}catch(error){}updateSoundToggle()};updateSoundToggle();render();

// Une iframe ne transmet pas naturellement la molette à la page qui l'embarque.
// Aux limites du widget, on rend donc le défilement à la page PureOwner.
if(window.parent!==window){
  const parentOrigin=window.location.origin;
  document.documentElement.classList.add('is-embedded');
  try{history.scrollRestoration='manual'}catch(error){}
  const resetEmbeddedScroll=()=>window.scrollTo(0,0);
  resetEmbeddedScroll();
  window.addEventListener('load',resetEmbeddedScroll,{once:true});
  window.addEventListener('wheel',event=>{
    window.parent.postMessage({type:'pureowner:tarot-wheel',deltaX:event.deltaX,deltaY:event.deltaY,deltaMode:event.deltaMode},parentOrigin);
    event.preventDefault();
  },{passive:false});
}
